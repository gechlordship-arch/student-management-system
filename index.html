<!DOCTYPE html>
<html>
<head>
  <title>Student Management System</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #eef2f5; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 800px; margin: auto; }
    input, button { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-size: 16px;}
    button { background: #0056b3; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s;}
    button:hover { background: #004494; }
    .btn-green { background: #28a745; } .btn-green:hover { background: #218838; }
    .btn-red { background: #dc3545; } .btn-red:hover { background: #c82333; }
    .btn-small { width: auto; padding: 8px 15px; margin: 0; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 25px; }
    th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: left; }
    th { background: #f8f9fa; color: #333; }
    tr:nth-child(even) { background: #fdfdfd; }
    
    .hidden { display: none !important; }
    h2, h3 { color: #333; margin-top: 0; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    .error-text { color: #dc3545; text-align: center; font-weight: bold; }
    .badge { background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 12px; text-transform: uppercase; font-weight: bold; }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div class="card" id="login-box">
    <h2 style="text-align: center;">School Portal Login</h2>
    <p style="text-align: center; color: #666; font-size: 14px;">Try logging in as Admin, Bob (Teacher), or Alice (Student)</p>
    <input type="email" id="email" placeholder="Email" value="admin@school.test">
    <input type="password" id="password" placeholder="Password" value="Admin123!">
    <button onclick="login()">Log In</button>
    <p id="error-msg" class="error-text hidden"></p>
  </div>

  <!-- DASHBOARD SECTION -->
  <div class="card hidden" id="dashboard">
    <div class="header-bar">
      <div>
        <h2 id="welcome-text">Welcome</h2>
        <span id="role-badge" class="badge">role</span>
      </div>
      <button class="btn-red btn-small" onclick="logout()">Log Out</button>
    </div>

    <div id="admin-view" class="hidden">
      <h3>All Students</h3>
      <table id="admin-students-table">
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Student No.</th></tr></thead>
        <tbody></tbody>
      </table>
      <h3>All Courses</h3>
      <table id="admin-courses-table">
        <thead><tr><th>Code</th><th>Course Name</th><th>Teacher</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="teacher-view" class="hidden">
      <h3>My Courses</h3>
      <table id="teacher-courses-table">
        <thead><tr><th>Code</th><th>Course Name</th><th>Credits</th></tr></thead>
        <tbody></tbody>
      </table>
      <h3>Students in My Courses</h3>
      <table id="teacher-enrollments-table">
        <thead><tr><th>Course</th><th>Student Name</th><th>Student No.</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="student-view" class="hidden">
      <h3>My Grades</h3>
      <div id="grades-container"></div>
      
      <h3>My Attendance</h3>
      <div id="attendance-container"></div>

      <div style="margin-top: 30px; text-align: center;">
        <button class="btn-green" style="width: 300px;" onclick="downloadPDF()">📄 Download My Report Card (PDF)</button>
      </div>
    </div>

  </div>

  <script>
    let token = null;
    let currentUser = null;
    const API_URL = 'http://localhost:3000/api';

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        
        if (res.ok) {
          token = data.token;
          currentUser = data.user;
          
          // Fetch profileId for students/teachers
          if (currentUser.role !== 'admin') {
            const meRes = await fetch(`${API_URL}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
            // We actually don't need /me if we just use the ID from the DB, 
            // but the token contains the profileId! We can decode it or just fetch data.
            // We will rely on the backend to filter data based on the token.
          }

          document.getElementById('login-box').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          errorMsg.classList.add('hidden');
          
          document.getElementById('welcome-text').innerText = `Welcome, ${currentUser.firstName} ${currentUser.lastName}`;
          document.getElementById('role-badge').innerText = currentUser.role;

          renderDashboard();
        } else {
          errorMsg.innerText = data.error || "Login failed";
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.innerText = "Cannot connect to server. Is npm run dev running?";
        errorMsg.classList.remove('hidden');
      }
    }

    function renderDashboard() {
      document.getElementById('admin-view').classList.add('hidden');
      document.getElementById('teacher-view').classList.add('hidden');
      document.getElementById('student-view').classList.add('hidden');

      if (currentUser.role === 'admin') {
        document.getElementById('admin-view').classList.remove('hidden');
        fetchAdminData();
      } else if (currentUser.role === 'teacher') {
        document.getElementById('teacher-view').classList.remove('hidden');
        fetchTeacherData();
      } else if (currentUser.role === 'student') {
        document.getElementById('student-view').classList.remove('hidden');
        fetchStudentData();
      }
    }

    // --- ADMIN LOGIC ---
    async function fetchAdminData() {
      const headers = { 'Authorization': `Bearer ${token}` };
      
      const [studentsRes, coursesRes] = await Promise.all([
        fetch(`${API_URL}/students`, { headers }),
        fetch(`${API_URL}/courses`, { headers })
      ]);

      const students = await studentsRes.json();
      const courses = await coursesRes.json();

      const sBody = document.querySelector('#admin-students-table tbody');
      sBody.innerHTML = students.map(s => `<tr><td>${s.id}</td><td>${s.first_name} ${s.last_name}</td><td>${s.email}</td><td>${s.student_number}</td></tr>`).join('');

      const cBody = document.querySelector('#admin-courses-table tbody');
      cBody.innerHTML = courses.map(c => `<tr><td>${c.course_code}</td><td>${c.name}</td><td>${c.teacher_first ? c.teacher_first + ' ' + c.teacher_last : 'Unassigned'}</td></tr>`).join('');
    }

    // --- TEACHER LOGIC ---
    async function fetchTeacherData() {
      const headers = { 'Authorization': `Bearer ${token}` };
      
      // 1. Fetch Teacher's Courses
      const coursesRes = await fetch(`${API_URL}/courses`, { headers });
      const courses = await coursesRes.json();
      
      const cBody = document.querySelector('#teacher-courses-table tbody');
      cBody.innerHTML = courses.map(c => `<tr><td>${c.course_code}</td><td>${c.name}</td><td>${c.credits}</td></tr>`).join('');

      // 2. Fetch Enrollments (students in teacher's courses)
      const enrollRes = await fetch(`${API_URL}/enrollments`, { headers });
      const enrollments = await enrollRes.json();

      const eBody = document.querySelector('#teacher-enrollments-table tbody');
      eBody.innerHTML = enrollments.map(e => `<tr><td>${e.course_code}</td><td>${e.student_first} ${e.student_last}</td><td>${e.student_number}</td></tr>`).join('');
      if(enrollments.length === 0) eBody.innerHTML = '<tr><td colspan="3">No students enrolled yet.</td></tr>';
    }

    // --- STUDENT LOGIC ---
    async function fetchStudentData() {
      const headers = { 'Authorization': `Bearer ${token}` };
      
      // The backend uses the token to identify the student, 
      // but our endpoint requires the student's DB ID (profileId). 
      // We can grab it by decoding the JWT token, but let's just fetch her specific data.
      // Wait, our route is /students/:id/grades. 
      // To make this easy, let's decode the JWT to get the profileId.
      const payload = JSON.parse(atob(token.split('.')[1]));
      const studentId = payload.profileId;

      // 1. Fetch Grades
      const gradesRes = await fetch(`${API_URL}/students/${studentId}/grades`, { headers });
      const grades = await gradesRes.json();
      
      let gradesHtml = '';
      grades.courses.forEach(c => {
        gradesHtml += `<div style="margin-bottom:15px; padding:15px; border:1px solid #ddd; border-radius:6px;">
          <h4>${c.courseCode} - ${c.courseName} <span style="float:right; color:#0056b3;">Overall: ${c.weightedPercent !== null ? c.weightedPercent + '%' : 'N/A'}</span></h4>
          <ul style="margin:5px 0; padding-left:20px;">`;
        c.assessments.forEach(a => {
          gradesHtml += `<li>${a.name} (${a.type}): ${a.score !== null ? a.score : '-'} / ${a.maxScore} (Weight: ${a.weight})</li>`;
        });
        gradesHtml += `</ul></div>`;
      });
      document.getElementById('grades-container').innerHTML = gradesHtml || '<p>No grades yet.</p>';

      // 2. Fetch Attendance
      const attRes = await fetch(`${API_URL}/students/${studentId}/attendance`, { headers });
      const attendance = await attRes.json();
      
      let attHtml = '<table><thead><tr><th>Course</th><th>Present</th><th>Absent</th><th>Late</th><th>Total</th><th>Rate</th></tr></thead><tbody>';
      Object.values(attendance.summary).forEach(s => {
        attHtml += `<tr>
          <td>${s.courseName}</td>
          <td style="color:green">${s.present}</td>
          <td style="color:red">${s.absent}</td>
          <td style="color:orange">${s.late}</td>
          <td>${s.total}</td>
          <td><strong>${(s.attendanceRate * 100).toFixed(1)}%</strong></td>
        </tr>`;
      });
      attHtml += '</tbody></table>';
      document.getElementById('attendance-container').innerHTML = attHtml || '<p>No attendance yet.</p>';
    }

    // --- PDF DOWNLOAD LOGIC ---
    async function downloadPDF() {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        const studentId = payload.profileId;

        const res = await fetch(`${API_URL}/students/${studentId}/report-card`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!res.ok) throw new Error('Failed to download');
        
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `report-card-${currentUser.firstName}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        alert("Error downloading PDF: Make sure server is running.");
      }
    }

    function logout() {
      token = null;
      currentUser = null;
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('login-box').classList.remove('hidden');
    }
  </script>
</body>
</html>
